<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Open-call story: curated stock collabs. Copy clear of top ~250 / bottom ~380 Stories UI */
  .top { position: absolute; left: 72px; right: 72px; top: 260px; display: flex; justify-content: space-between; align-items: center; }
  .top .wm { width: 150px; color: var(--cream); }
  .top .label { font-size: 20px; color: var(--gray-300); display: flex; align-items: center; gap: 12px; }
  .ph { left: 72px; top: 350px; width: 936px; height: 520px; }
  .ph::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(246,238,227,.12); }
  h1 { position: absolute; left: 72px; right: 72px; top: 930px; font-size: 128px; line-height: .9; }
  h1 span { color: #6B55FF; }
  .body { position: absolute; left: 72px; right: 140px; top: 1190px; font-family: "Inter"; font-size: 34px; line-height: 1.42; color: #D8CFC2; }
  .rule { position: absolute; left: 72px; right: 72px; top: 1400px; height: 1px; background: var(--gray-700); opacity: 1; }
  .tag { position: absolute; left: 72px; top: 1432px; font-size: 22px; color: var(--cream); }
  .cta { position: absolute; left: 72px; top: 1498px; display: flex; align-items: center; gap: 20px; }

<body>
<div class="ad story ink">
  <div class="top"><span class="label"><span class="dot"></span>Open call</span><span class="wm"></span></div>
  <div class="photo ph" data-src="photos/p11_back_closeup.jpg" data-crop="140,560,1050"></div>
  <h1 class="display">High-Spec<br><span>Collabs.</span></h1>
  <p class="body">Exceptional products belong in the right spaces. If you have finished inventory that meets strict quality requirements and want to collaborate on a curated drop, let's talk.</p>
  <div class="rule"></div>
  <div class="label tag">Quality first. Execution done right.</div>
  <div class="cta"><span class="btn">Share your details in the DMs →</span></div>
</div>
<script src="crop.js"></script>
