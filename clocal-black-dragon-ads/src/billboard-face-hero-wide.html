<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Product-hero wide face: front + back of the crewneck side by side, name in the middle */
  .ad { width: 2400px; height: 775px; background: radial-gradient(ellipse 70% 90% at 50% 55%, #F6EEE3 0%, #E6DCCB 100%); color: var(--ink); }
  .mk { position: absolute; top: 40px; height: 700px; filter: drop-shadow(0 26px 30px rgba(10,10,10,.28)); }
  .f { left: 120px; } .b { right: 120px; }
  .mid { position: absolute; left: 0; right: 0; top: 210px; text-align: center; }
  .mid h1 { font-family: "Satoshi"; font-weight: 900; font-size: 120px; line-height: .9; letter-spacing: -.04em; text-transform: uppercase; }
  .mid h1 span { color: var(--blue); }
  .mid .label { font-size: 26px; margin-top: 30px; color: var(--gray-700); }
  .mid .wm { width: 200px; color: var(--blue); margin: 34px auto 0; }
</style></head>
<body>
<div class="ad">
  <img class="mk f" src="sizechart/mockup_front@3x.png">
  <img class="mk b" src="sizechart/mockup_back@3x.png">
  <div class="mid"><h1>Black<br><span>Dragon.</span></h1><div class="label">Crewneck · pre-order now</div><span class="wm"></span></div>
</div>
</body></html>
