<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Ref: Aire polo — hero cut-out right, framed detail insets left wired to points on the garment */
  .ad { background: #EDEAE4; color: var(--ink); }
  .hero { position: absolute; left: 192px; top: -548px; width: 1065px;
          -webkit-mask-image: linear-gradient(180deg,#000 88%,transparent 100%); mask-image: linear-gradient(180deg,#000 88%,transparent 100%); }
  .wm { position: absolute; left: 40px; top: 44px; width: 150px; color: var(--blue); }
  .ins { outline: 2px solid var(--ink); outline-offset: 6px; }
  svg { position: absolute; inset: 0; }
  svg line { stroke: #8C857A; stroke-width: 2; }
  svg .dot { fill: var(--orange); }
  svg .ring { fill: none; stroke: var(--cream); stroke-width: 2; }
  .cap { position: absolute; display: flex; flex-direction: column; gap: 4px; }
  .cap .n { font-size: 13px; color: var(--orange); }
  .cap .t { font-size: 16px; font-weight: 600; }
  .cap .s { font-size: 13px; color: var(--gray-500); }
  .name { position: absolute; left: 40px; top: 1150px; }
  .name h1 { font-family: "Satoshi"; font-weight: 900; font-size: 42px; line-height: .95; letter-spacing: -.02em; text-transform: uppercase; }
  .name .label { font-size: 14px; margin-top: 10px; }
  .name .label b { color: var(--blue); font-weight: 600; }
  .btn { position: absolute; right: 40px; bottom: 44px; }
</style></head>
