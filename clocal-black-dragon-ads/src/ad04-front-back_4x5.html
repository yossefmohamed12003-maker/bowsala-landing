<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .head { position: absolute; left: 64px; right: 64px; top: 60px; display: flex; justify-content: space-between; align-items: flex-start; }
  .head h1 { font-size: 100px; }
  .head .wm { width: 150px; color: var(--blue); margin-top: 14px; }
  .tile { top: 300px; width: 464px; height: 800px; }
  .t1 { left: 64px; } .t2 { left: 552px; }
  .cap { position: absolute; top: 1116px; font-size: 20px; color: var(--gray-500); }
  .c1 { left: 64px; } .c2 { left: 552px; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 56px; display: flex; justify-content: space-between; align-items: flex-end; }
  .foot .name { font-family: "Inter"; font-weight: 500; font-size: 28px; }
  .foot .amt { font-family: "Satoshi"; font-weight: 900; font-size: 64px; letter-spacing: -0.02em; line-height: 1; margin-top: 6px; }
</style></head>
<body>
<div class="ad cream">
  <div class="head">
    <h1 class="display">Front. Back.<br>Back in stock.</h1>
    <span class="wm"></span>
  </div>
  <div class="photo tile t1" data-src="photos/p08_man_vines_front.jpg" data-crop="300,210,840"></div>
  <div class="label cap c1">Front</div>
  <div class="photo tile t2" data-src="photos/p05_man_back_sky.jpg" data-crop="250,100,840"></div>
  <div class="label cap c2">Back — dragon print</div>
  <div class="foot">
    <div><div class="name">Black Dragon Crewneck</div><div class="amt">EGP 850</div></div>
    <span class="btn">Shop now →</span>
  </div>
</div>
<script src="crop.js"></script>
</body></html>
