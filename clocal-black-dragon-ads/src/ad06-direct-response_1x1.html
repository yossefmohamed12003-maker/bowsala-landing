<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .ph { left: 500px; top: 0; width: 580px; height: 1080px; }
  .col { position: absolute; left: 56px; top: 56px; bottom: 56px; width: 400px; display: flex; flex-direction: column; }
  .tag { align-self: flex-start; font-size: 18px; color: var(--cream); background: var(--blue); padding: 9px 14px 8px; }
  h1 { font-size: 68px; margin-top: 22px; }
  .amt { font-family: "Satoshi"; font-weight: 900; font-size: 84px; letter-spacing: -0.02em; line-height: 1; margin-top: auto; }
  .name { font-size: 16px; color: var(--gray-500); margin-top: 12px; }
  .btn { margin-top: 36px; align-self: flex-start; font-size: 30px; padding: 22px 32px; }
  .site { font-size: 16px; color: var(--gray-500); margin-top: 14px; }
  .wm { width: 150px; color: var(--blue); margin-top: 52px; }
</style></head>
<body>
<div class="ad sq cream">
  <div class="photo ph" data-src="photos/p03_man_sky_front.jpg" data-crop="270,0,895"></div>
  <div class="col">
    <span class="label tag">Best seller</span>
    <h1 class="display">Restocked.</h1>
    <div class="amt">EGP 850</div>
    <div class="label name">Black Dragon Crewneck</div>
    <span class="btn">Shop now →</span>
    <span class="label site">theclocal.com</span>
    <span class="wm"></span>
  </div>
</div>
<script src="crop.js"></script>
</body></html>
