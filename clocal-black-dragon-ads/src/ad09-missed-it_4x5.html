<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Same ad set as AD06, different structure: ink headline band on top, photo below, CTA sticker on the photo */
  .top { position: absolute; left: 0; right: 0; top: 0; height: 400px; padding: 56px 64px 0; }
  .top .label { font-size: 22px; color: var(--gray-300); display: flex; align-items: center; gap: 14px; }
  .top h1 { font-size: 116px; margin-top: 26px; color: var(--cream); }
  .ph { left: 0; top: 400px; width: 1080px; height: 790px; }
  .cta { position: absolute; left: 64px; right: 64px; top: 1190px; bottom: 0; align-items: center !important; display: flex; justify-content: space-between; align-items: flex-end; }
  .cta .name { font-family: "Satoshi"; font-weight: 900; font-size: 44px; letter-spacing: -0.02em; line-height: 1; color: var(--cream); }
  
</style></head>
<body>
<div class="ad ink">
  <div class="top">
    <div class="label"><span class="dot"></span>Best seller — restock pre-order</div>
    <h1 class="display">Missed it<br>last time?</h1>
  </div>
  <div class="photo ph" data-src="photos/p17_man_front_rooftop.jpg" data-crop="0,690,1717"></div>
  <div class="cta">
    <div class="name">Black Dragon<br>Crewneck</div>
    <span class="btn">Pre-order now →</span>
  </div>
</div>
<script src="crop.js"></script>
</body></html>
