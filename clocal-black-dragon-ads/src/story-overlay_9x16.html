<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Transparent overlay burned onto the order-notification screen recording (1080×1920).
     Copy sits below the top ~250px Stories UI; the bottom ~380px stays clear for the link sticker. */
  html, body { background: transparent; }
  .ad { background: transparent; }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 640px; background: var(--ink); padding: 268px 64px 0; }
  .top .label { font-size: 24px; color: var(--gray-300); display: flex; align-items: center; gap: 14px; }
  .top h1 { font-size: 112px; margin-top: 22px; color: var(--cream); }
  .top p { font-family: "Satoshi"; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; color: var(--gray-300); margin-top: 22px; }
  .top p b { color: var(--cream); font-weight: 700; }
  .cta { position: absolute; left: 0; right: 0; top: 1440px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .cta .btn { font-size: 46px; padding: 30px 56px; box-shadow: 0 0 0 6px var(--ink); }
  .cta .label { font-size: 22px; color: var(--cream); background: var(--ink); padding: 10px 18px; }
</style></head>
<body>
<div class="ad story">
  <div class="top">
    <div class="label"><span class="dot"></span>Best seller — restock pre-order</div>
    <h1 class="display">The last drop<br>looked like this.</h1>
    <p><b>The Black Dragon is back.</b> EGP 850.</p>
  </div>
  <div class="cta">
    <span class="btn">Pre-order now ↓</span>
    <span class="label">Link below · theclocal.com</span>
  </div>
</div>
</body></html>
