<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .ph { left: 0; top: 0; width: 1080px; height: 1130px; }
  .over { position: absolute; left: 64px; top: 56px; }
  .tag { display: inline-block; font-size: 20px; color: var(--cream); background: var(--blue); padding: 10px 16px 9px; }
  .over h1 { font-size: 112px; margin-top: 18px; color: var(--ink); }
  .band { position: absolute; left: 64px; right: 64px; top: 1130px; bottom: 0; display: flex; justify-content: space-between; align-items: center; }
  .amt { font-family: "Satoshi"; font-weight: 900; font-size: 56px; letter-spacing: -0.02em; line-height: 1; }
  .name { font-size: 18px; color: var(--gray-500); margin-top: 10px; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .right .label { font-size: 18px; color: var(--gray-500); }
</style></head>
<body>
<div class="ad cream">
  <div class="photo ph" data-src="photos/p03_man_sky_front.jpg" data-crop="0,0,1333"></div>
  <div class="over">
    <span class="label tag">Best seller restock</span>
    <h1 class="display">Pre-order open.</h1>
  </div>
  <div class="band">
    <div><div class="amt">Black Dragon<br>Crewneck</div></div>
    <div class="right"><span class="btn">Pre-order now →</span><span class="label">theclocal.com</span></div>
  </div>
</div>
<script src="crop.js"></script>
</body></html>
