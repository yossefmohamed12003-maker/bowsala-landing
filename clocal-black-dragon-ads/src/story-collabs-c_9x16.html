<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Concept: bold brand-blue manifesto */
  .ad { background: var(--blue); color: var(--cream); }
  .top { position: absolute; left: 72px; right: 72px; top: 260px; display: flex; justify-content: space-between; align-items: center; }
  .top .wm { width: 150px; color: var(--cream); }
  .top .label { font-size: 20px; display: flex; align-items: center; gap: 12px; }
  h1 { position: absolute; left: 60px; right: 40px; top: 400px; font-family: "Satoshi"; font-weight: 900; font-size: 196px; line-height: .84; letter-spacing: -.05em; text-transform: uppercase; }
  .body { position: absolute; left: 72px; right: 110px; top: 980px; font-family: "Inter"; font-size: 34px; line-height: 1.42; }
  .rule { position: absolute; left: 72px; right: 72px; top: 1220px; height: 2px; background: var(--cream); opacity: .5; }
  .tag { position: absolute; left: 72px; top: 1250px; font-size: 22px; }
  .cta { position: absolute; left: 72px; top: 1330px; }
  .cta .btn { background: var(--cream); color: var(--ink); font-size: 32px; padding: 24px 36px; }
</style></head>
<body>
<div class="ad story">
  <div class="top"><span class="label"><span class="dot"></span>Open call</span><span class="wm"></span></div>
  <h1>High<br>-Spec<br>Collabs.</h1>
  <p class="body">Exceptional products belong in the right spaces. If you have finished inventory that meets strict quality requirements and want to collaborate on a curated drop, let's talk.</p>
  <div class="rule"></div>
  <div class="label tag">Quality first. Execution done right.</div>
  <div class="cta"><span class="btn">Share your details in the DMs →</span></div>
</div>
</body></html>
