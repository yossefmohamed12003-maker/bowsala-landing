<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Product-hero tower face: the crewneck alone, spot-lit, minimal type (ref: CITYWIDE sneaker) */
  .ad { width: 1000px; height: 2176px; background: radial-gradient(ellipse 85% 50% at 50% 45%, #FBF6EF 0%, #EDE3D3 60%, #D9CCB8 100%); color: var(--ink); }
  .mk { position: absolute; left: 40px; top: 560px; width: 920px; filter: drop-shadow(0 40px 50px rgba(10,10,10,.35)); }
  .floor { position: absolute; left: 160px; right: 160px; top: 1500px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(10,10,10,.35), transparent 70%); }
  .k { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: "Satoshi"; font-weight: 900; font-size: 138px; line-height: .9; letter-spacing: -.04em; text-transform: uppercase; }
  .k span { color: var(--blue); }
  .sub { position: absolute; left: 0; right: 0; top: 1640px; text-align: center; font-size: 30px; color: var(--gray-700); }
  .wm { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; width: 300px; color: var(--blue); }
</style></head>
<body>
<div class="ad">
  <div class="k">Black<br><span>Dragon.</span></div>
  <div class="floor"></div>
  <img class="mk" src="sizechart/mockup_front@3x.png">
  <div class="label sub">Crewneck · best seller · pre-order now</div>
  <span class="wm"></span>
</div>
</body></html>
