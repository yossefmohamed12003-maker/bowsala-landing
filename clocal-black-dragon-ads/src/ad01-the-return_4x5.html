<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .ph { left: 0; top: 0; width: 1080px; height: 900px; }
  .band { position: absolute; left: 0; right: 0; top: 900px; bottom: 0; padding: 44px 64px 52px; display: flex; flex-direction: column; }
  .band .label { font-size: 22px; color: var(--gray-300); display: flex; align-items: center; gap: 14px; }
  .band h1 { font-size: 104px; margin-top: 22px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .foot .wm { width: 200px; color: var(--cream); }
  .price { display: flex; align-items: center; gap: 28px; }
  .price .amt { font-family: "Satoshi"; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; }
  
</style></head>
<body>
<div class="ad ink">
  <div class="photo ph" data-src="photos/p11_back_closeup.jpg" data-crop="0,350,1333"></div>
  <div class="band">
    <div class="label"><span class="dot"></span>Restock pre-order — Black Dragon Crewneck</div>
    <h1 class="display">The Black Dragon<br>is back.</h1>
    <div class="foot">
      <span class="wm"></span>
      <div class="price"><div class="amt">EGP 850</div><span class="btn sm">Pre-order now →</span></div>
    </div>
  </div>
</div>
<script src="crop.js"></script>
</body></html>
