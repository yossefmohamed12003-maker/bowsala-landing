<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Fit guide — same structure as the Gawhar & Wound chart on theclocal.com */
  .kicker { position: absolute; left: 56px; top: 104px; font-size: 13px; line-height: 1.35; color: var(--ink); display: flex; gap: 10px; }
  .kicker b { color: var(--orange); font-weight: 600; }
  h1 { position: absolute; left: 52px; top: 138px; font-family: "Satoshi"; font-weight: 900; text-transform: uppercase;
       font-size: 94px; line-height: 0.9; letter-spacing: -0.03em; }
  .meta { position: absolute; right: 48px; top: 236px; text-align: right; font-size: 12px; line-height: 1.75; color: var(--gray-500); }
  svg.fig { position: absolute; overflow: visible; }
  .fig text { font-family: "Geist Mono"; font-weight: 600; letter-spacing: 0.1em; }
  table { position: absolute; left: 652px; top: 400px; width: 380px; border-collapse: collapse; }
  th { font-family: "Geist Mono"; font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-500);
       text-align: right; padding: 12px 0 10px; border-top: 1.5px solid var(--gray-500); border-bottom: 1px solid var(--hairline-strong); }
  th:first-child, td:first-child { text-align: left; }
  td { font-family: "Satoshi"; font-weight: 900; letter-spacing: -0.02em; text-align: right; padding: 26px 0 22px;
       border-bottom: 1px solid var(--hairline-strong); font-size: 33px; line-height: 1; }
  tr:last-child td { border-bottom: none; }
  td:first-child { font-size: 46px; width: 74px; }
  td small { font-family: "Geist Mono"; font-weight: 500; font-size: 9px; letter-spacing: 0.08em; margin-left: 3px; }
  .cap { position: absolute; left: 56px; right: 48px; top: 942px; padding-top: 14px; border-top: 1px solid var(--hairline-strong);
         display: flex; justify-content: space-between; font-size: 11px; color: var(--gray-500); }
  .cap span i { font-style: normal; color: var(--orange); margin-right: 6px; }
</style></head>
<body>
<div class="ad sq cream">
  <div class="kicker mono-label"><b>01</b><span>— Fit<br>guide</span></div>
  <h1>Black Dragon<br><span class="blue">Crewneck</span></h1>
  <div class="meta mono-label">Black Dragon — Black<br>Front view<br>Measured flat · CM</div>

  <!-- Figure: one SVG in reference-mockup coordinates (1280×1920), scaled so the mockup is 500px wide -->
  <svg class="fig" style="left:3.8px; top:157.5px; width:614.4px; height:921.6px" viewBox="0 0 1280 1920">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10" fill="none" stroke="#FF4200" stroke-width="1.6"/>
      </marker>
    </defs>
    <image href="sizechart/mockup_front.png" x="88.5" y="401.5" width="1104" height="1131"/>
    <g stroke="#FF4200" stroke-width="2.6" fill="none">
      <!-- height: guides + vertical -->
      <line x1="740" y1="413" x2="1262" y2="413" stroke-dasharray="7 7" stroke-width="2"/>
      <line x1="990" y1="1424" x2="1262" y2="1424" stroke-dasharray="7 7" stroke-width="2"/>
      <line x1="1244" y1="420" x2="1244" y2="1417" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <!-- width: chest at armhole height -->
      <line x1="306" y1="790" x2="976" y2="790" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <!-- sleeve: shoulder seam to cuff -->
      <line x1="258" y1="740" x2="176" y2="1500" marker-start="url(#ar)" marker-end="url(#ar)" stroke-dasharray="10 6"/>
    </g>
    <g font-size="25" fill="#F6EEE3">
      <rect x="1166" y="900" width="156" height="44" fill="#FF4200"/><text x="1244" y="930" text-anchor="middle">↕ HEIGHT</text>
      <rect x="566" y="768" width="150" height="44" fill="#FF4200"/><text x="641" y="798" text-anchor="middle">↔ WIDTH</text>
      <rect x="142" y="1098" width="150" height="44" fill="#FF4200"/><text x="217" y="1128" text-anchor="middle">⤢ SLEEVE</text>
    </g>
  </svg>

  <table>
    <tr><th>Size</th><th>Width ↔</th><th>Height ↕</th><th>Sleeve ⤢</th></tr>
    <tr><td>S</td><td>60.4<small>CM</small></td><td>62.0<small>CM</small></td><td>53.5<small>CM</small></td></tr>
    <tr><td>M</td><td>63.4<small>CM</small></td><td>64.0<small>CM</small></td><td>54.0<small>CM</small></td></tr>
    <tr><td>L</td><td>66.4<small>CM</small></td><td>66.0<small>CM</small></td><td>54.5<small>CM</small></td></tr>
    <tr><td>XL</td><td>70.0<small>CM</small></td><td>68.0<small>CM</small></td><td>55.0<small>CM</small></td></tr>
  </table>

  <div class="cap mono-label">
    <span>Measured flat</span>
    <span><i>↔</i>Width — chest at armhole</span>
    <span><i>↕</i>Height — top to hem</span>
    <span><i>⤢</i>Sleeve — shoulder seam to cuff</span>
  </div>
</div>
</body></html>
