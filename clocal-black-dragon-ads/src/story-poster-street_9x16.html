<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Raw streetwear take: full-bleed photo, oversized cropped type, rotated stickers. Bottom ~380px left for link sticker. */
  .ph { left: 0; top: 0; width: 1080px; height: 1920px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,0) 30%, rgba(10,10,10,0) 55%, rgba(10,10,10,.85) 82%); }
  .big { position: absolute; font-family: "Satoshi"; font-weight: 900; letter-spacing: -0.05em; line-height: .8; color: var(--cream); text-transform: uppercase; white-space: nowrap; }
  .b1 { left: -14px; top: 250px; font-size: 290px; }
  .b2 { right: 40px; top: 1180px; font-size: 262px; -webkit-text-stroke: 4px var(--cream); color: transparent; }
  .tape { position: absolute; font-family: "Geist Mono"; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; padding: 14px 22px; }
  .t1 { left: 60px; top: 520px; background: var(--orange); color: var(--ink); font-size: 26px; transform: rotate(-4deg); }
  .t2 { right: 52px; top: 600px; background: var(--cream); color: var(--ink); font-size: 22px; transform: rotate(5deg); }
  .t3 { left: 70px; top: 1110px; background: var(--ink); color: var(--cream); font-size: 20px; transform: rotate(-2deg); }
  .sticker { position: absolute; left: 50%; top: 1440px; transform: translateX(-50%) rotate(-3deg); background: var(--blue); color: var(--cream);
             font-family: "Satoshi"; font-weight: 900; font-size: 64px; letter-spacing: -0.02em; padding: 26px 46px; box-shadow: 10px 10px 0 var(--ink); white-space: nowrap; }
  .wm { position: absolute; left: 50%; transform: translateX(-50%); top: 1622px; width: 140px; color: var(--cream); }
</style></head>
<body>
<div class="ad story ink">
  <div class="photo ph" data-src="photos/p05_man_back_sky.jpg" data-crop="244,0,937"></div>
  <div class="shade"></div>
  <div class="big b1">It's<br>back.</div>
  <span class="wm"></span>
  <div class="big b2">Again.</div>
  <div class="sticker">Pre-order now ↓</div>
</div>
<script src="crop.js"></script>
</body></html>
