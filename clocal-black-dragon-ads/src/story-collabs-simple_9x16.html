<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Plain, well-ordered announcement story. Content block centred in the safe area */
  .wrap { position: absolute; left: 96px; right: 96px; top: 50%; transform: translateY(-50%); }
  .wm { width: 170px; color: var(--cream); }
  h1 { font-size: 112px; line-height: .95; margin-top: 90px; }
  .rule { height: 1px; background: var(--gray-700); opacity: 1; margin: 56px 0; }
  p { font-family: "Inter"; font-size: 38px; line-height: 1.5; color: #D8CFC2; }
  .tag { font-family: "Satoshi"; font-weight: 700; font-size: 40px; letter-spacing: -.01em; color: var(--cream); margin-top: 48px; }
  .dm { font-family: "Inter"; font-size: 38px; line-height: 1.5; color: var(--cream); }
</style></head>
<body>
<div class="ad story ink">
  <div class="wrap">
    <span class="wm"></span>
    <h1 class="display">High-Spec Collabs</h1>
    <div class="rule"></div>
    <p>Exceptional products belong in the right spaces. If you have finished inventory that meets strict quality requirements and want to collaborate on a curated drop, let's talk.</p>
    <div class="tag">Quality first. Execution done right.</div>
    <div class="rule"></div>
    <p class="dm">Share your details with us in the DMs.</p>
  </div>
</div>
</body></html>
